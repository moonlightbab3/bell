<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Affirmation Timer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- MAIN SCREEN -->
  <div class="container" id="mainScreen">
    <h1 class="app-title">🔔 Affirmation Timer</h1>

    <!-- AFFIRMATION DISPLAY BOX -->
    <div class="affirmation-box" id="affirmationBox">
      <p class="affirmation-text" id="affirmationText">
        Your affirmation will appear here...
      </p>
    </div>

    <!-- TIMER CONTROLS -->
    <div class="card">
      <h2 class="section-title">⏱ Timer Settings</h2>

      <div class="input-group">
        <label>Hours</label>
        <input type="number" id="hours" min="0" max="23" value="0" placeholder="0"/>
      </div>

      <div class="input-group">
        <label>Minutes</label>
        <input type="number" id="minutes" min="0" max="59" value="1" placeholder="1"/>
      </div>

      <div class="input-group">
        <label>Seconds</label>
        <input type="number" id="seconds" min="0" max="59" value="0" placeholder="0"/>
      </div>

      <div class="countdown-display" id="countdownDisplay">
        Next affirmation in: --:--:--
      </div>

      <div class="button-row">
        <button class="btn btn-start" id="startBtn" onclick="startTimer()">
          ▶ Start
        </button>
        <button class="btn btn-stop" id="stopBtn" onclick="stopTimer()">
          ⏹ Stop
        </button>
        <button class="btn btn-reset" onclick="resetTimer()">
          🔄 Reset
        </button>
      </div>
    </div>

    <!-- BELL SOUND SETTINGS -->
    <div class="card">
      <h2 class="section-title">🔔 Bell Sound</h2>

      <div class="input-group">
        <label>Choose Bell Sound</label>
        <select id="bellSelect" onchange="previewBell()">
          <option value="bell1">🔔 Classic Bell</option>
          <option value="bell2">🎵 Soft Chime</option>
          <option value="bell3">🎶 Deep Gong</option>
          <option value="bell4">✨ Ding</option>
        </select>
      </div>

      <div class="input-group">
        <label>Volume</label>
        <input type="range" id="volumeSlider" min="0" max="1"
               step="0.1" value="0.7" oninput="updateVolume(this.value)"/>
        <span id="volumeLabel">70%</span>
      </div>

      <button class="btn btn-preview" onclick="previewBell()">
        🔊 Preview Sound
      </button>
    </div>

    <!-- AFFIRMATIONS MANAGER -->
    <div class="card">
      <h2 class="section-title">💬 My Affirmations</h2>

      <div class="input-group">
        <label>Add New Affirmation</label>
        <textarea id="newAffirmation" rows="3"
          placeholder="Type your affirmation here..."></textarea>
      </div>

      <button class="btn btn-add" onclick="addAffirmation()">
        ➕ Add Affirmation
      </button>

      <div class="affirmation-list" id="affirmationList">
        <!-- affirmations show here -->
      </div>
    </div>

  </div>

  <!-- POPUP OVERLAY -->
  <div class="popup-overlay" id="popupOverlay">
    <div class="popup-box">
      <div class="popup-bell">🔔</div>
      <h2 class="popup-title">Your Affirmation</h2>
      <p class="popup-text" id="popupText"></p>
      <button class="btn btn-close" onclick="closePopup()">
        ✓ Got It!
      </button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
